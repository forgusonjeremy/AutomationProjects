              state:
                visible: true
                read-only: false
              signpostPosition: right-middle
        - id: section_83eb4644
          fields:
            - id: joinDomain
              display: checkbox
              state:
                visible: true
                read-only: false
              signpostPosition: right-middle
        - id: section_3fd02fe8
