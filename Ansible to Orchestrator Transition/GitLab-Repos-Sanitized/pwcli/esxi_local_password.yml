---
- name: Create local accounts on ESXi hosts in staging cluster
  hosts: localhost
  gather_facts: false
  vars:
    vcenter_hostname: "{{ vcenter_server }}"
    vcenter_username: "administrator@vsphere.local"
    vcenter_password: "{{ vcenter_password }}"
    cluster_name: "staging"
    # Define the local account details
    local_username: "{{ esxi_local_username | default('localadmin') }}"
    local_password: "{{ esxi_local_password }}"
    local_description: "Local administrator account created by Ansible"
    
  tasks:
    - name: Gather cluster information from vCenter
      community.vmware.vmware_cluster_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        cluster_name: "{{ cluster_name }}"
      register: cluster_info
      delegate_to: localhost

    - name: Display cluster information
      debug:
        msg: "Found cluster '{{ cluster_name }}' with {{ cluster_info.clusters[cluster_name].hosts | length }} hosts"

    - name: Get ESXi hosts from staging cluster
      community.vmware.vmware_host_facts:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
      loop: "{{ cluster_info.clusters[cluster_name].hosts }}"
      register: esxi_hosts_info
      delegate_to: localhost

    - name: Create local user account on each ESXi host
      community.vmware.vmware_local_user_manager:
        hostname: "{{ item }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        local_user_name: "{{ local_username }}"
        local_user_password: "{{ local_password }}"
        local_user_description: "{{ local_description }}"
        state: present
      loop: "{{ cluster_info.clusters[cluster_name].hosts }}"
      register: user_creation_results
      delegate_to: localhost
      ignore_errors: true

    - name: Display results of user creation
      debug:
        msg: |
          Host: {{ item.item }}
          Status: {{ 'Success' if not item.failed else 'Failed' }}
          {% if item.failed %}
          Error: {{ item.msg | default('Unknown error') }}
          {% endif %}
      loop: "{{ user_creation_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assign Administrator role to local user on each ESXi host
      community.vmware.vmware_local_role_manager:
        hostname: "{{ item }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        local_user_name: "{{ local_username }}"
        local_role_name: "Admin"
        state: present
      loop: "{{ cluster_info.clusters[cluster_name].hosts }}"
      register: role_assignment_results
      delegate_to: localhost
      ignore_errors: true

    - name: Display results of role assignment
      debug:
        msg: |
          Host: {{ item.item }}
          Status: {{ 'Success' if not item.failed else 'Failed' }}
          {% if item.failed %}
          Error: {{ item.msg | default('Unknown error') }}
          {% endif %}
      loop: "{{ role_assignment_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Summary of operations
      debug:
        msg: |
          ========================================
          SUMMARY
          ========================================
          Cluster: {{ cluster_name }}
          Total ESXi hosts: {{ cluster_info.clusters[cluster_name].hosts | length }}
          Local account created: {{ local_username }}
          
          User Creation Results:
          {% for result in user_creation_results.results %}
          - {{ result.item }}: {{ 'SUCCESS' if not result.failed else 'FAILED' }}
          {% endfor %}
          
          Role Assignment Results:
          {% for result in role_assignment_results.results %}
          - {{ result.item }}: {{ 'SUCCESS' if not result.failed else 'FAILED' }}
          {% endfor %}