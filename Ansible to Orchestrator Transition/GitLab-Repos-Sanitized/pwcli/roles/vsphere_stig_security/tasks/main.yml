---
# roles/vsphere_stig_security/tasks/main.yml
- name: Load production STIG configuration
  ansible.builtin.include_vars:
    file: "config/production_stig_config.yml"
  tags: [config]

- name: Apply production security STIG controls
  block:
    - name: "ESXI80000227: Password History"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Security.PasswordMaxDays: "{{ stig_config.security.password_max_age }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000227
      ignore_errors: true
      tags: [account_policy]

    - name: "ESXI80000043: Configure account security policies"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Security.PasswordHistory: "{{ stig_config.security.password_history }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000043
      ignore_errors: true
      tags: [account_policy]

    - name: "ESXI80000035: Password Complexity"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Security.PasswordQualityControl: "{{ stig_config.security.password_complexity }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000035
      ignore_errors: true
      tags: [account_policy]

    - name: "ESXI80000111: Account Unlock Time"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Security.AccountUnlockTime: "{{ stig_config.security.account_unlock_time }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000111
      ignore_errors: true
      tags: [account_policy]

    - name: "ESXI80000005: Account Lock Failures"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Security.AccountLockFailures: "{{ stig_config.security.account_lock_failures }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000005
      ignore_errors: true
      tags: [account_policy]

    - name: "ESXI80000226: API Timeout"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Config.HostAgent.vmacore.soap.sessionTimeout: "{{ stig_config.security.api_timeout }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000226
      ignore_errors: true
      tags: [timeouts]

    - name: "ESXI80000196: DCUI Timeout"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          UserVars.DcuiTimeOut: "{{ stig_config.security.dcui_timeout }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000196
      ignore_errors: true
      tags: [timeouts]

    - name: "ESXI80000195: Shell Timeout"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          UserVars.ESXiShellTimeOut: "{{ stig_config.security.shell_timeout }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000195
      ignore_errors: true
      tags: [timeouts]

    - name: "ESXI80000068: Shell Interactive Timeout"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          UserVars.ESXiShellInteractiveTimeOut: "{{ stig_config.security.shell_interactive_timeout }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000068
      ignore_errors: true
      tags: [timeouts]

    - name: "ESXI80000010: Host Client Timeout"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          UserVars.HostClientSessionTimeout: "{{ stig_config.security.host_client_timeout }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000010
      ignore_errors: true
      tags: [timeouts]

    - name: "ESXI80000241: The ESXi host must not use the default Active Directory ESX Admin group"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Config.HostAgent.plugins.hostsvc.esxAdminsGroup: "{{ esx_admin_group }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000241
      ignore_errors: true
      tags: [memory, network]

    - name: "ESXI80000250: BMC Network"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Net.BMCNetworkEnable: "{{ stig_config.security.bmc_network_enable }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000250
      ignore_errors: true
      tags: [memory, network]

    - name: "ESXI80000215: Block Guest BPDU"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Net.BlockGuestBPDU: "{{ stig_config.security.block_guest_bpdu }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000215
      ignore_errors: true
      tags: [memory, network]

    - name: "ESXI80000213: Memory Salting"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Mem.ShareForceSalting: "{{ stig_config.security.share_force_salting }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000213
      ignore_errors: true
      tags: [memory, network]

    - name: "ESXI80000225: Memory Eager Zero"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Mem.MemEagerZero: "{{ stig_config.security.mem_eager_zero }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000225
      ignore_errors: true
      tags: [memory, network]

    - name: "ESXI80000047: Disable MOB"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Config.HostAgent.plugins.solo.enableMob: "{{ stig_config.security.enable_mob }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000047
      ignore_errors: true
      tags: [features]

    - name: "ESXI80000222: Suppress Shell Warning"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          UserVars.SuppressShellWarning: "{{ stig_config.security.suppress_shell_warning }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000222
      ignore_errors: true
      tags: [features]

    - name: "ESXI80000223: uppress Hyperthreading Warning"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          UserVars.SuppressHyperthreadWarning: "{{ stig_config.security.suppress_hyper_warning }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000223
      ignore_errors: true
      tags: [features]

    - name: "ESXI80000244: Execute VIBs"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          VMkernel.Boot.execInstalledOnly: "{{ stig_config.security.execute_vibs }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000244
      ignore_errors: true
      tags: [features]

    - name: "ESXI80000008: Enable lockdown mode"
      community.vmware.vmware_host_lockdown:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        state: "{{ stig_config.security.lockdown_level }}"
      loop: "{{ esxi_hosts }}"
      when: stig_config.controls_enabled.ESXI80000008
      ignore_errors: true
      tags: [lockdown]

  when:
    - stig_config.security is defined 
