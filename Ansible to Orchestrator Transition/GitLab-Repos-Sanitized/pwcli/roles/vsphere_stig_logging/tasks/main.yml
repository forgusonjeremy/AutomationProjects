---
# roles/vsphere_stig_logging/tasks/main.yml
- name: Load production STIG configuration
  ansible.builtin.include_vars:
    file: "config/production_stig_config.yml"
  tags: [config]
  
- name: Configure production logging STIG controls
  block:
    - name: Configure logging settings
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Config.HostAgent.log.level: "{{ stig_config.logging.log_level }}"
          Syslog.global.logLevel: "{{ stig_config.logging.syslog_log_level }}"
          Syslog.global.logDir: "{{ stig_config.logging.syslog_scratch }}"
      loop: "{{ esxi_hosts }}"
      ignore_errors: true
      tags: [log_config]

    - name: Configure production syslog server
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Syslog.global.logHost: "{{ syslog_server }}"
      loop: "{{ esxi_hosts }}"
      when: syslog_server | length > 0
      ignore_errors: true
      tags: [syslog]

    - name: Configure production audit logging
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Syslog.global.auditRecord.storageCapacity: "{{ stig_config.logging.audit_storage_capacity }}"
          Syslog.global.auditRecord.storageEnable: "{{ stig_config.logging.syslog_audit_enable }}"
          Syslog.global.auditRecord.remoteEnable: "{{ stig_config.logging.syslog_audit_remote }}"
      loop: "{{ esxi_hosts }}"
      ignore_errors: true
      tags: [audit]

    - name: Configure production SSL certificate checking
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Syslog.global.certificate.checkSSLCerts: "{{ stig_config.logging.syslog_cert_check }}"
          Syslog.global.certificate.strictX509Compliance: "{{ stig_config.logging.syslog_cert_strict }}"
      loop: "{{ esxi_hosts }}"
      ignore_errors: true
      tags: [ssl]
    
  when:
    - stig_config.services is defined