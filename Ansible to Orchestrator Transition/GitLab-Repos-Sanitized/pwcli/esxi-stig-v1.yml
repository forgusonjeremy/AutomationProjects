---
- name: VMware vSphere 8.0 STIG ESXi Remediation for AAP 2.5
  hosts: localhost
  gather_facts: false

  collections:
    - community.vmware

  vars:
    # These will be provided via job template survey or extra_vars
    vcenter_hostname: #"esocdowvxvcs.pilot.dev" # "{{ vcenter_server }}"
    vcenter_username: #"administrator@vsphere.local" # "{{ vcenter_user }}"
    vcenter_password: "{{ vcenter_pass | default('V1rtu@1c3!') }}"
    syslog_host: #"udp://100.64.0.54:514" #udp://100.64.0.54:514
    ntp_server_list: #"100.64.1.128" 
    target_hostname:  #"{{ esxi_hostname | default('') }}"  #"esocdowvxrln8.pilot.dev"
    target_cluster: #"VxRail-Virtual-SAN-Cluster-2f4158d4-ab51-4b26-8d2f-239810aecf13" #"{{ esxi_cluster | default('') }}"
    
    # Environment specific variables
    syslog_server: "{{ syslog_host | default('') }}"
    ntp_servers: "{{ ntp_server_list | default([]) }}"
    allowed_ips: "{{ firewall_allowed_ips | default([]) }}"
    esx_admin_group: "{{ esxi_admin_group | default('root') }}"
    esxi_build: "{{ target_esxi_build | default('24022510') }}"
    banner_preference: "{{ banner_pref | default('') }}"
    log_insight_enabled: "{{ log_insight | default(false) }}"

    # STIG control settings
    stig_settings:
      account_lock_failures:
        name: "Security.AccountLockFailures"
        value: "3"
      host_client_timeout:
        name: "UserVars.HostClientSessionTimeout"
        value: "900"
      log_level:
        name: "Config.HostAgent.log.level"
        value: "info"
      password_complexity:
        name: "Security.PasswordQualityControl"
        value: "similar=deny retry=3 min=disabled,disabled,disabled,disabled,15"
      password_history:
        name: "Security.PasswordHistory"
        value: "5"
      enable_mob:
        name: "Config.HostAgent.plugins.solo.enableMob"
        value: false
      shell_int_timeout:
        name: "UserVars.ESXiShellInteractiveTimeOut"
        value: "900"
      account_unlock_time:
        name: "Security.AccountUnlockTime"
        value: "900"
      audit_record_storage_cap:
        name: "Syslog.global.auditRecord.storageCapacity"
        value: "100"
      syslog_host:
        name: "Syslog.global.logHost"
        value: "{{ syslog_server }}"
      vib_accept_level: "PartnerSupported"
      dcui_access:
        name: "DCUI.Access"
        value: "root"
      ssh_enabled: false
      shell_enabled: false
      shell_timeout:
        name: "UserVars.ESXiShellTimeOut"
        value: "600"
      dcui_timeout:
        name: "UserVars.DcuiTimeOut"
        value: "600"
      share_force_salting:
        name: "Mem.ShareForceSalting"
        value: "2"
      block_guest_bpdu:
        name: "Net.BlockGuestBPDU"
        value: "1"
      dvfilter_bind_ip:
        name: "Net.DVFilterBindIpAddress"
        value: ""
      suppress_shell_warning:
        name: "UserVars.SuppressShellWarning"
        value: "0"
      suppress_hyper_warning:
        name: "UserVars.SuppressHyperthreadWarning"
        value: "0"
      syslog_cert_check:
        name: "Syslog.global.certificate.checkSSLCerts"
        value: "true"
      mem_eager_zero:
        name: "Mem.MemEagerZero"
        value: "1"
      api_timeout:
        name: "Config.HostAgent.vmacore.soap.sessionTimeout"
        value: "30"
      password_max_age:
        name: "Security.PasswordMaxDays"
        value: "90"
      cim_enabled: false
      slpd_enabled: false
      syslog_audit_enable:
        name: "Syslog.global.auditRecord.storageEnable"
        value: true
      syslog_audit_remote:
        name: "Syslog.global.auditRecord.remoteEnable"
        value: true
      syslog_cert_strict:
        name: "Syslog.global.certificate.strictX509Compliance"
        value: true
      syslog_log_level:
        name: "Syslog.global.logLevel"
        value: "info"
      esx_admins_group:
        name: "Config.HostAgent.plugins.hostsvc.esxAdminsGroup"
        value: "{{ esx_admin_group }}"
      syslog_scratch:
        name: "Syslog.global.logDir"
        value: "[] /scratch/log"
      execute_vibs:
        name: "VMkernel.Boot.execInstalledOnly"
        value: "true"
      tls_server_profile: "NIST_2024"
      bmc_network_enable:
        name: "Net.BMCNetworkEnable"
        value: 0
      lockdown_level: "normal"
      auto_discover_network: true
    
    # Control enablement flags - can be overridden via extra_vars
    controls_enabled:
      ESXI80000005: "{{ enable_ESXI80000005 | default(false) | bool }}"   # Account Lock Failures
      ESXI80000006: "{{ enable_ESXI80000006 | default(false) | bool }}"   # DoD Banner
      ESXI80000008: "{{ enable_ESXI80000008 | default(true) | bool }}"  # Lockdown Mode
      ESXI80000010: "{{ enable_ESXI80000010 | default(false) | bool }}"   # Host Client Timeout
      ESXI80000015: "{{ enable_ESXI80000015 | default(false) | bool }}"   # Log Level
      ESXI80000035: "{{ enable_ESXI80000035 | default(false) | bool }}"   # Password Complexity
      ESXI80000043: "{{ enable_ESXI80000043 | default(false) | bool }}"   # Password History
      ESXI80000047: "{{ enable_ESXI80000047 | default(false) | bool }}"   # Disable MOB
      ESXI80000068: "{{ enable_ESXI80000068 | default(false) | bool }}"   # Shell Interactive Timeout
      ESXI80000111: "{{ enable_ESXI80000111 | default(false) | bool }}"   # Account Unlock Time
      ESXI80000113: "{{ enable_ESXI80000113 | default(false) | bool }}"   # Audit Storage Capacity
      ESXI80000114: "{{ enable_ESXI80000114 | default(false) | bool }}"   # Syslog
      ESXI80000124: "{{ enable_ESXI80000124 | default(false) | bool }}"   # NTP
      ESXI80000133: "{{ enable_ESXI80000133 | default(false) | bool }}"   # VIB Acceptance Level
      ESXI80000189: "{{ enable_ESXI80000189 | default(false) | bool }}"   # DCUI Access
      ESXI80000193: "{{ enable_ESXI80000193 | default(false) | bool }}"   # SSH Disabled
      ESXI80000194: "{{ enable_ESXI80000194 | default(false) | bool }}"   # Shell Disabled
      ESXI80000195: "{{ enable_ESXI80000195 | default(false) | bool }}"   # Shell Timeout
      ESXI80000196: "{{ enable_ESXI80000196 | default(false) | bool }}"   # DCUI Timeout
      ESXI80000213: "{{ enable_ESXI80000213 | default(false) | bool }}"   # Memory Salting
      ESXI80000214: "{{ enable_ESXI80000214 | default(false) | bool }}"   # Default Firewall
      ESXI80000215: "{{ enable_ESXI80000215 | default(false) | bool }}"   # BPDU
      ESXI80000216: "{{ enable_ESXI80000216 | default(false) | bool }}"   # Forged Transmits
      ESXI80000217: "{{ enable_ESXI80000217 | default(false) | bool }}"   # MAC Changes
      ESXI80000218: "{{ enable_ESXI80000218 | default(false) | bool }}"   # Promiscuous Mode
      ESXI80000219: "{{ enable_ESXI80000219 | default(false) | bool }}"   # DVFilter
      ESXI80000222: "{{ enable_ESXI80000222 | default(false) | bool }}"   # Suppress Shell Warning
      ESXI80000223: "{{ enable_ESXI80000223 | default(false) | bool }}"   # Suppress Hyperthreading Warning
      ESXI80000224: "{{ enable_ESXI80000224 | default(false) | bool }}"   # Syslog Cert Check
      ESXI80000225: "{{ enable_ESXI80000225 | default(false) | bool }}"   # Memory Eager Zero
      ESXI80000226: "{{ enable_ESXI80000226 | default(false) | bool }}"   # API Timeout
      ESXI80000227: "{{ enable_ESXI80000227 | default(false) | bool }}"   # Password Age
      ESXI80000228: "{{ enable_ESXI80000228 | default(false) | bool }}"   # CIM Service
      ESXI80000231: "{{ enable_ESXI80000231 | default(false) | bool }}"   # SLPD Service
      ESXI80000232: "{{ enable_ESXI80000232 | default(false) | bool }}"   # Syslog Audit Enable
      ESXI80000233: "{{ enable_ESXI80000233 | default(false) | bool }}"   # Syslog Audit Remote
      ESXI80000234: "{{ enable_ESXI80000234 | default(false) | bool }}"   # Syslog Cert Strict
      ESXI80000235: "{{ enable_ESXI80000235 | default(false) | bool }}"   # Syslog Log Level
      ESXI80000243: "{{ enable_ESXI80000243 | default(false) | bool }}"   # Persistent Logs
      ESXI80000244: "{{ enable_ESXI80000244 | default(false) | bool }}"   # Execute VIBs
      ESXI80000250: "{{ enable_ESXI80000250 | default(false) | bool }}"   # BMC Network
    
    # DoD Banner text
    issue_banner: "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."

  tasks:
    - setup:
        gather_subset:
          - min
    - name: q
      debug: 
       var=ansible_date_time.epoch
       var=ansible_date_time.iso8601

    - name: Initialize variables
      set_fact:
        failed_count: 0
        remediation_results: {}

    - name: Validate required parameters
      assert:
        that:
          - vcenter_hostname is defined and vcenter_hostname != ""
          - vcenter_username is defined and vcenter_username != ""
          - vcenter_password is defined and vcenter_password != ""
          #- (target_hostname != "" and target_cluster == "") or (target_hostname == "" and target_cluster != "")
        fail_msg: "Missing required parameters. Need vCenter details and either hostname or cluster."

    - name: Display job information
      debug:
        msg:
          - "=== VMware vSphere 8.0 STIG Remediation ==="
          - "vCenter: {{ vcenter_hostname }}"
          - "Target Host: {{ target_hostname if target_hostname != '' else 'N/A' }}"
          - "Target Cluster: {{ target_cluster if target_cluster != '' else 'N/A' }}"
          - "Syslog Server: {{ syslog_server if syslog_server != '' else 'Not configured' }}"
          - "NTP Servers: {{ ntp_servers | join(', ') if ntp_servers | length > 0 else 'Not configured' }}"

    - name: Gather ESXi host information
      block:
        - name: Initialize esxi_hosts variable
          set_fact:
            esxi_hosts: []

        - name: Parse target_hostname to list
          set_fact:
            esxi_hosts:  "{{ target_hostname.split(',') | map('trim') | select | list }}"
            #target_hostname_list: "{{ target_hostname.split(',') | map('trim') | select | list }}"
          when: target_hostname is defined and target_hostname != ""

        - name: Get hosts by cluster
          community.vmware.vmware_host_config_info:
            hostname: "{{ vcenter_hostname }}"
            username: "{{ vcenter_username }}"
            password: "{{ vcenter_password }}"
            validate_certs: false
            cluster_name: "{{ target_cluster }}"
          register: cluster_host_info
          when: 
            - target_cluster is defined 
            - target_cluster != ""
            - esxi_hosts | count == 0  # Only if no hosts found by hostname
          failed_when: false

        - name: Process cluster host results - extract hostnames
          set_fact:
            esxi_hosts: "{{ cluster_host_info.hosts_info.keys() | list }}"
          when: 
            - cluster_host_info is defined
            - cluster_host_info.hosts_info is defined
            - cluster_host_info.hosts_info | count > 0

        - name: Display discovered hosts summary
          debug:
            msg: "Found {{ esxi_hosts | count }} ESXi host(s)"


    ## Core STIG Controls Implementation
    - name: "ESXI-80-000005: Account Lock Failures"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Security.AccountLockFailures: 3
          #"{{ stig_settings.account_lock_failures.name }}: {{ stig_settings.account_lock_failures.value }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000005
      register: result_005
      ignore_errors: true
      tags: [core_security, account_security]

    - name: "ESXI-80-000010: Host Client Timeout"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          UserVars.HostClientSessionTimeout: 900
          #"{{ stig_settings.host_client_timeout.name }}": "{{ stig_settings.host_client_timeout.value }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000010
      register: result_010
      ignore_errors: true
      tags: [core_security, timeouts]

    - name: "ESXI-80-000015: Log Level"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Config.HostAgent.log.level: info
          #"{{ stig_settings.log_level.name }}": "{{ stig_settings.log_level.value }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000015
      register: result_015
      ignore_errors: true
      tags: [logging, core_security]

    - name: "ESXI-80-000035: Password Complexity"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Security.PasswordQualityControl: "similar=deny retry=3 min=disabled,disabled,disabled,disabled,15"
          #"{{ stig_settings.password_complexity.name }}": "{{ stig_settings.password_complexity.value }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000035
      register: result_035
      ignore_errors: true
      tags: [core_security, password_policy]

    - name: "ESXI-80-000043: Password History"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Security.PasswordHistory: 5
          #"{{ stig_settings.password_history.name }}": "{{ stig_settings.password_history.value }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000043
      register: result_043
      ignore_errors: true
      tags: [core_security, password_policy]

    - name: "ESXI-80-000047: Disable MOB"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Config.HostAgent.plugins.solo.enableMob: false
          #"{{ stig_settings.enable_mob.name }}": "{{ stig_settings.enable_mob.value }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000047
      register: result_047
      ignore_errors: true
      tags: [core_security, services]

    - name: "ESXI-80-000114: Syslog Configuration"
      community.vmware.vmware_host_config_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        options:
          Syslog.global.logHost: "{{syslog_server}}"
          #"{{ stig_settings.Syslog.global.logHost.name }}": "{{ stig_settings.syslog_host.value }}"
      loop: "{{ esxi_hosts }}"
      when: 
        - controls_enabled.ESXI80000114
        - syslog_server != ""
        #- not (syslog_server is match('\\s+'))
        #- not log_insight_enabled
      register: result_114
      ignore_errors: true
      tags: [logging, syslog]

    - name: "ESXI-80-000124: NTP Configuration"
      community.vmware.vmware_host_ntp:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        ntp_servers: "{{ ntp_servers }}"
        state: present
      loop: "{{ esxi_hosts }}"
      when: 
        - controls_enabled.ESXI80000124
        - ntp_servers | length > 0
      register: result_124
      ignore_errors: true
      tags: [time_sync, ntp]

    - name: "ESXI-80-000193: SSH Service Disable"
      community.vmware.vmware_host_service_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        service_name: TSM-SSH
        state: "{{ 'started' if stig_settings.ssh_enabled else 'stop' }}"
        service_policy: "{{ 'on' if stig_settings.ssh_enabled else 'off' }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000193
      register: result_193
      ignore_errors: true
      tags: [services, ssh]

    - name: "ESXI-80-000194: ESXi Shell Service Disable"
      community.vmware.vmware_host_service_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        service_name: TSM
        state: "{{ 'started' if stig_settings.shell_enabled else 'stop' }}"
        service_policy: "{{ 'on' if stig_settings.shell_enabled else 'off' }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000194
      register: result_194
      ignore_errors: true
      tags: [services, shell]

    # Lockdown Mode (if enabled) - should be last
    - name: "ESXI-80-000008: Enable Lockdown Mode"
      community.vmware.vmware_host_lockdown:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        esxi_hostname: "{{ item }}"
        #state: normal
        state: "{{ stig_settings.lockdown_level }}"
      loop: "{{ esxi_hosts }}"
      when: controls_enabled.ESXI80000008
      register: result_008
      ignore_errors: true
      tags: [lockdown_mode, security]

    # ##Summary and reporting
    # - name: Calculate remediation results
    #   set_fact:
    #     remediation_summary:
    #       total_hosts: "{{ esxi_hosts | length }}"
    #       controls_applied:
    #         ESXI80000005: "{{ 'SUCCESS' if result_005 is succeeded else ('FAILED' if result_005 is defined else 'SKIPPED') }}"
    #         ESXI80000006: "{{ 'SUCCESS' if result_006 is succeeded else ('FAILED' if result_006 is defined else 'SKIPPED') }}"
    #         ESXI80000010: "{{ 'SUCCESS' if result_010 is succeeded else ('FAILED' if result_010 is defined else 'SKIPPED') }}"
    #         ESXI80000015: "{{ 'SUCCESS' if result_015 is succeeded else ('FAILED' if result_015 is defined else 'SKIPPED') }}"
    #         ESXI80000035: "{{ 'SUCCESS' if result_035 is succeeded else ('FAILED' if result_035 is defined else 'SKIPPED') }}"
    #         ESXI80000043: "{{ 'SUCCESS' if result_043 is succeeded else ('FAILED' if result_043 is defined else 'SKIPPED') }}"
    #         ESXI80000047: "{{ 'SUCCESS' if result_047 is succeeded else ('FAILED' if result_047 is defined else 'SKIPPED') }}"
    #         ESXI80000114: "{{ 'SUCCESS' if result_114 is succeeded else ('FAILED' if result_114 is defined else 'SKIPPED') }}"
    #         ESXI80000124: "{{ 'SUCCESS' if result_124 is succeeded else ('FAILED' if result_124 is defined else 'SKIPPED') }}"
    #         ESXI80000133: "{{ 'SUCCESS' if result_133 is succeeded else ('FAILED' if result_133 is defined else 'SKIPPED') }}"
    #         ESXI80000193: "{{ 'SUCCESS' if result_193 is succeeded else ('FAILED' if result_193 is defined else 'SKIPPED') }}"
    #         ESXI80000194: "{{ 'SUCCESS' if result_194 is succeeded else ('FAILED' if result_194 is defined else 'SKIPPED') }}"
    #         ESXI80000214: "{{ 'SUCCESS' if result_214 is succeeded else ('FAILED' if result_214 is defined else 'SKIPPED') }}"
    #         ESXI80000216: "{{ 'SUCCESS' if result_216 is succeeded else ('FAILED' if result_216 is defined else 'SKIPPED') }}"
    #         ESXI80000217: "{{ 'SUCCESS' if result_217 is succeeded else ('FAILED' if result_217 is defined else 'SKIPPED') }}"
    #         ESXI80000218: "{{ 'SUCCESS' if result_218 is succeeded else ('FAILED' if result_218 is defined else 'SKIPPED') }}"
    #         ESXI80000008: "{{ 'SUCCESS' if result_008 is succeeded else ('FAILED' if result_008 is defined else 'SKIPPED') }}"

    # - name: Generate final STIG remediation report
    #   debug:
    #     msg:
    #       - "============================================="
    #       - "VMware vSphere 8.0 STIG Remediation Report"
