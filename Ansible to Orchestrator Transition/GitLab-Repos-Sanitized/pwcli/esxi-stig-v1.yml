    # - name: Save remediation results to artifact
    #   copy:
    #     content: |
    #       # VMware vSphere 8.0 STIG Remediation Results
          
    #       **Job Information:**
    #       - Job Template: {{ tower_job_template_name | default('N/A') }}
    #       - Job ID: {{ tower_job_id | default('N/A') }}
    #       - Execution Date: {{ ansible_date_time.iso8601 }}
