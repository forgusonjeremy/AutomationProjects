    #       - "  ESXI-80-000214 (Firewall Policy): {{ remediation_summary.controls_applied.ESXI80000214 }}"
    #       - "  ESXI-80-000216 (Forged Transmits): {{ remediation_summary.controls_applied.ESXI80000216 }}"
