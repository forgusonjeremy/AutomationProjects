sles15STIG_stigrule_234803__etc_issue_Content: 'You are accessing a U.S. Government information system, which includes (1) this computer, (2) this computer network, (3) all computers connected to this network, and (4) all devices and storage media attached to this network or to a computer on this network. This information system is provided for U.S. Government-authorized use only. Unauthorized or improper use of this system may result in disciplinary action, as well as civil and criminal penalties. By using this information system, you understand and consent to the following. You have no reasonable expectation of privacy regarding any communications or data transiting or stored on this information system. At, any time, and for any lawful government purpose, the government may, monitor, intercept, and search and seize any communication or data transiting, or stored on this information system. Any communications or data transiting or stored on this information system may, be disclosed or used for any lawful government purpose. Nothing herein consents to the search or seizure of a privately-owned computer or other privately owned communications device, or the contents thereof, that is in the system users home.
  eth0: \4{eth0} \6{eth0}
  eth1: \4{eth1} \6{eth1}
  eth2: \4{eth2} \6{eth2}
  '
