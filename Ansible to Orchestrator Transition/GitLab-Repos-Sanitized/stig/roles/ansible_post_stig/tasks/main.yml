- name: populate package facts
  package_facts:
# R-257816 RHEL-09-213105
- name: stigrule_257816_user_max_user_namespaces
  sysctl:
    name: user.max_user_namespaces
    value: "{{ rhel9STIG_stigrule_257816_user_max_user_namespaces_Value }}"
    sysctl_file: "{{ rhel9STIG_stigrule_257816_user_max_user_namespaces_File }}"
  notify: sysctl_load_settings
  when:
    - rhel9STIG_stigrule_257816_Manage
# R-257816 RHEL-09-213105
- name: stigrule_257816_user_max_user_namespaces
  sysctl:
    name: user.max_user_namespaces
    value: "{{ rhel9STIG_stigrule_257816_v1_user_max_user_namespaces_Value }}"
    sysctl_file: "{{ rhel9STIG_stigrule_257816_v1_user_max_user_namespaces_File }}"
  notify: sysctl_load_settings
  when:
    - rhel9STIG_stigrule_257816_v1_Manage
# R-258113 RHEL-09-611120
- name: stigrule_258113__etc_security_pwquality_conf
  lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^\s*maxclassrepeat'
    line: "{{ rhel9STIG_stigrule_258113__etc_security_pwquality_conf_Line }}"
    create: yes
  when:
    - rhel9STIG_stigrule_258113_Manage
# R-257984 RHEL-09-255040
- name: stigrule_257984_PermitEmptyPasswords
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '(?i)^\s*PermitEmptyPasswords\s+'
    line: "{{ rhel9STIG_stigrule_257984_PermitEmptyPasswords_Line }}"
  notify: ssh_restart
  when:
    - rhel9STIG_stigrule_257984_Manage
    - "'openssh-server' in packages"
# R-257835 RHEL-09-215060
- name: stigrule_257835_tftp
  yum:
    name: tftp
    state: "{{ rhel9STIG_stigrule_257835_tftp_State }}"
  when: rhel9STIG_stigrule_257835_Manage

# cvs_sudoers_nopasswd_Manage
- name: cvs_sudoers_nopasswd_conf
  lineinfile:
    path: /etc/sudoers
    regexp: '^\s*# %wheel        ALL=(ALL)       NOPASSWD: ALL'
    line: "{{ cvs_sudoers_nopasswd_conf_Line }}"
    create: yes
  when:
    - cvs_sudoers_nopasswd_Manage
