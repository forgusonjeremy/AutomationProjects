---
- name: playbook to run powershell script remotely
  hosts: all
  become_method: runas
  gather_facts: yes
  connection: winrm
  port: 5986

  vars:
    var_ps_folder:        'ps_scripts'                       # root folder under files/
    var_ps_script_file:   'cvs_idle_oversized_vms.ps1'
    var_parameter_action: 'get_idle_oversized_vms'

    var_vCenterList:      'dom10.dom5.dom3.invalid, dom14.dom5.dom3.invalid, dom9.dom5.dom3.invalid, dom8.dom5.dom3.invalid, dom11.dom5.dom3.invalid'   # <-- your vCenters, comma-separated

    var_eMailReport:      'yes'                              # 'yes' to actually send
    var_SMTPServer:       'dom1.dom2.dom3.example'        # <-- your relay
    var_MailToString:     'user3@dom3.example'
    var_MailCcString:     ''
    var_MailSubjectstring: 'Ansible-Report: Idle Oversized VM Rightsizing Targets'

    var_LookbackDays:             '30'
    var_StatIntervalMins:        '120'
    var_TargetCpuPct:            '50'
    var_TargetMemPct:            '70'
    var_MinimumCpuToEvaluate:    '4'
    var_MinimumMemoryGBToEvaluate: '8'
    var_MinimumReclaimvCPU:      '2'
    var_MinimumReclaimMemGB:     '4'

  tasks:
  - name: "Create temporary directory"
    ansible.windows.win_tempfile:
      state: directory
    register: tempdir

  - name: "Script Operations"
    block:
    - name: "Copy Scripts to Host"
      ansible.windows.win_copy:
        src: "files/{{ var_ps_folder }}"
        dest: "{{ tempdir.path }}"

    - name: check if file exist
      ansible.windows.win_stat:
        path: '{{ tempdir.path }}\{{ var_ps_folder }}\{{ var_ps_script_file }}'
      register: file_data

    - name: Run PowerShell script
      when: file_data.stat.exists == true
      no_log: false
      environment:
        VC_USER: "{{ vcenter_username }}"
        VC_PASS: "{{ vcenter_password }}"
      ansible.windows.win_command: >
        powershell.exe -ExecutionPolicy ByPass
        -File "{{ tempdir.path }}\{{ var_ps_folder }}\{{ var_ps_script_file }}"
        -Action "{{ var_parameter_action }}" -eMailReport "{{ var_eMailReport }}"
        -SMTPServer "{{ var_SMTPServer }}"
        -MailToString "{{ var_MailToString }}"
        -MailCcString "{{ var_MailCcString }}"
        -MailSubjectstring "{{ var_MailSubjectstring }}"
        -vCenterList "{{ var_vCenterList }}"
        -LookbackDays "{{ var_LookbackDays }}"
        -StatIntervalMins "{{ var_StatIntervalMins }}"
        -TargetCpuPct "{{ var_TargetCpuPct }}"
        -TargetMemPct "{{ var_TargetMemPct }}"
        -MinimumCpuToEvaluate "{{ var_MinimumCpuToEvaluate }}"
        -MinimumMemoryGBToEvaluate "{{ var_MinimumMemoryGBToEvaluate }}"
        -MinimumReclaimvCPU "{{ var_MinimumReclaimvCPU }}"
        -MinimumReclaimMemGB "{{ var_MinimumReclaimMemGB }}"

    - name: "List the debug folder content"
      ansible.windows.win_shell: 'ls -Recurse {{ tempdir.path }}\{{ var_ps_folder }}'

    always:
    - name: "Cleanup Temporary Files"
      ansible.windows.win_file:
        state: absent
        path: "{{ tempdir.path }}"
