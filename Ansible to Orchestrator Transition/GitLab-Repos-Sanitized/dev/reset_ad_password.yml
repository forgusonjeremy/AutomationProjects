---
- name: Reset AD Account Password
  hosts: all
  gather_facts: false
  collections:
    - microsoft.ad
    - ansible.controller

  vars:
    acc_new_pw: ""

    # Domain selector. Override at launch:  -e target_domain=phub
    target_domain: connect

    # Runtime krb5.conf written by pre_tasks (per-realm, EE-safe)
    krb5_conf_path: "{{ lookup('env', 'HOME') }}/krb5.conf"

    # Authentication - Use EITHER username/password OR token
    controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('', true) }}"
    controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('', true) }}"
    controller_token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') | default('', true) }}"

    controller_validate_certs: false

  environment:
    KRB5_CONFIG: "{{ krb5_conf_path }}"

  pre_tasks:
    - name: Load domain vars
      ansible.builtin.include_vars: "vars/{{ target_domain }}.yml"
      run_once: true

    - name: Assert required domain vars are present
      ansible.builtin.assert:
        that:
          - var_LDAPUsername is defined and var_LDAPUsername | length > 0
          - var_domain_server is defined and var_domain_server | length > 0
          - var_krb5_realm is defined and var_krb5_realm | length > 0
          - var_krb5_kdc is defined and var_krb5_kdc | length > 0
          - var_AAP_Credentials is defined and var_AAP_Credentials | length > 0
          - controller_host is defined and controller_host | length > 0
        fail_msg: "vars/{{ target_domain }}.yml is incomplete"
      run_once: true

    - name: Write krb5.conf for target realm
      ansible.builtin.template:
        src: templates/krb5.conf.j2
        dest: "{{ krb5_conf_path }}"
        mode: "0644"
      delegate_to: localhost
      run_once: true

  roles:
    - account
