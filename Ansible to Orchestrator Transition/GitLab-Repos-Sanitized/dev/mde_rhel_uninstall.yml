---
- name: Uninstall Microsoft Defender for Endpoint on RHEL
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Check if mdatp is installed
      command: rpm -q mdatp
      register: mdatp_installed_check
      changed_when: false
      failed_when: false

    - name: Display mdatp installation status
      debug:
        msg: "mdatp is {{ 'installed, proceeding with uninstall' if mdatp_installed_check.rc == 0 else 'not installed, nothing to uninstall' }}"

    - name: Check if fapolicyd service exists
      systemd:
        name: fapolicyd
      register: fapolicyd_service_check
      failed_when: false
      changed_when: false

    - name: Stop fapolicyd service before MDE uninstall
      systemd:
        name: fapolicyd
        state: stopped
      register: fapolicyd_stop_result
      when: fapolicyd_service_check.status is defined and fapolicyd_service_check.status.LoadState == "loaded"

    - name: Display fapolicyd stop result
      debug:
        msg: "fapolicyd service {{ 'stopped' if fapolicyd_stop_result.changed else 'was already stopped' }}"
      when: fapolicyd_service_check.status is defined and fapolicyd_service_check.status.LoadState == "loaded"

    - name: Display fapolicyd service not found message
      debug:
        msg: "fapolicyd service not found on system, skipping stop operation"
      when: fapolicyd_service_check.status is not defined or fapolicyd_service_check.status.LoadState != "loaded"

    - name: Remove mdatp package via dnf
      dnf:
        name: mdatp
        state: absent
      register: mdatp_remove_result
      when: mdatp_installed_check.rc == 0

    - name: Display mdatp removal result
      debug:
        msg: "mdatp package {{ 'removed successfully' if mdatp_remove_result.changed else 'was already absent' }}"
      when: mdatp_installed_check.rc == 0

    - name: Confirm mdatp is no longer installed
      command: rpm -q mdatp
      register: mdatp_post_uninstall_check
      changed_when: false
      failed_when: false
      when: mdatp_installed_check.rc == 0

    - name: Fail if mdatp is still present after removal
      fail:
        msg: "mdatp package is still installed after removal attempt. Manual intervention may be required."
      when:
        - mdatp_installed_check.rc == 0
        - mdatp_post_uninstall_check.rc == 0

    - name: Start fapolicyd service after MDE uninstall
      systemd:
        name: fapolicyd
        state: started
      register: fapolicyd_start_result
      when: fapolicyd_service_check.status is defined and fapolicyd_service_check.status.LoadState == "loaded"

    - name: Display fapolicyd start result
      debug:
        msg: "fapolicyd service {{ 'started' if fapolicyd_start_result.changed else 'was already running' }}"
      when: fapolicyd_service_check.status is defined and fapolicyd_service_check.status.LoadState == "loaded"

    - name: Display uninstall completion message
      debug:
        msg: "Microsoft Defender for Endpoint uninstall process completed successfully"