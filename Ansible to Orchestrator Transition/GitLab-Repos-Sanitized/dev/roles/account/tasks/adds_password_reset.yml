---
- name: Print out for debug only
  ansible.builtin.debug:
    msg: "{{ acc_new_pw }}"
  when: var_debug == 69
  no_log: false

- name: "Look up '{{ var_sAMAccountName }}' in ADDS"
  microsoft.ad.object_info:
    domain_server: "{{ var_domain_server }}"
    domain_username: "{{ var_ad_admin_user | default(ansible_user) }}"
    domain_password: "{{ var_ad_admin_pass | default(ansible_password) }}"
    ldap_filter: >-
      (&(objectClass=user)(|(sAMAccountName={{ var_sAMAccountName }})(userPrincipalName={{ var_LDAPUsername }})))
    properties:
      - sAMAccountName
      - userPrincipalName
  register: ad_account

- name: Show lookup result
  ansible.builtin.debug:
    var: ad_account.objects
  when: var_debug == 69

- name: Assert account exists and is unique
  ansible.builtin.assert:
    that:
      - ad_account.objects | length == 1
    fail_msg: >-
      Expected exactly 1 match for '{{ var_sAMAccountName }}' on
      {{ var_domain_server }}, found {{ ad_account.objects | length }} -
      refusing to continue
    quiet: true

- name: "Update password for '{{ var_sAMAccountName }}' - '{{ var_LDAPUsername }}' in ADDS"
  microsoft.ad.user:
    domain_server: "{{ var_domain_server }}"
    domain_username: "{{ var_ad_admin_user | default(ansible_user) }}"
    domain_password: "{{ var_ad_admin_pass | default(ansible_password) }}"
    identity: "{{ ad_account.objects[0].DistinguishedName }}"
    name: "{{ ad_account.objects[0].Name }}"
    password: "{{ acc_new_pw }}"
    update_password: always
    state: present
  register: adds_reset
  no_log: false

- name: Confirm ADDS password was changed
  ansible.builtin.assert:
    that:
      - adds_reset.changed
    fail_msg: >-
      AD reported no change for '{{ var_sAMAccountName }}' on {{ var_domain_server }} -
      aborting before AAP credentials are patched
    quiet: true