---
# Included per credential type:
#   - name: Update AAP credentials
#     ansible.builtin.include_tasks: aap_credential_update.yml
#     loop: "{{ var_Credential_type }}"

- name: Reset per-item facts
  ansible.builtin.set_fact:
    cred_type_exists: false
    cred_type_id: ""
    cred_id: ""
    cred_inputs: {}
    update_result: {}

- name: Debug new password
  ansible.builtin.debug:
    msg: "{{ acc_new_pw }}"
  when: var_debug == 69
  no_log: false

- name: Get organization ID
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/organizations/?name={{ var_AAP_organization | urlencode }}"
    method: GET
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    status_code: 200
  register: org_lookup
  delegate_to: localhost

- name: Fail if organization not found
  ansible.builtin.fail:
    msg: "Organization '{{ var_AAP_organization }}' not found on {{ controller_host }}"
  when: org_lookup.json.results | length == 0

- name: Set organization ID
  ansible.builtin.set_fact:
    org_id: "{{ org_lookup.json.results[0].id }}"

- name: Get credential type ID for {{ item }}
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credential_types/?name={{ item | urlencode }}"
    method: GET
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    status_code: 200
  register: cred_type_lookup
  delegate_to: localhost

- name: Check if credential type exists
  ansible.builtin.set_fact:
    cred_type_exists: "{{ cred_type_lookup.json.results | length > 0 }}"

- name: Set credential type ID
  ansible.builtin.set_fact:
    cred_type_id: "{{ cred_type_lookup.json.results[0].id }}"
  when: cred_type_exists | bool

- name: Display credential type not found warning
  ansible.builtin.debug:
    msg: "WARN: credential type '{{ item }}' not found in AAP - skipping"
  when: not (cred_type_exists | bool)

- name: Get existing credential {{ var_AAP_Credentials }}
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credentials/?name={{ var_AAP_Credentials | urlencode }}&organization={{ org_id }}&credential_type={{ cred_type_id }}"
    method: GET
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    status_code: 200
  register: existing_cred
  delegate_to: localhost
  when: cred_type_exists | bool

- name: Debug - show credential search results
  ansible.builtin.debug:
    msg:
      - "Credential: '{{ var_AAP_Credentials }}'"
      - "Type: '{{ item }}' (ID: {{ cred_type_id }})"
      - "Organization: '{{ var_AAP_organization }}' (ID: {{ org_id }})"
      - "Matches: {{ existing_cred.json.results | length }}"
      - "Names: {{ existing_cred.json.results | map(attribute='name') | list }}"
  when: cred_type_exists | bool

- name: Fail on ambiguous credential match
  ansible.builtin.fail:
    msg: >-
      {{ existing_cred.json.results | length }} credentials named
      '{{ var_AAP_Credentials }}' of type '{{ item }}' in org
      '{{ var_AAP_organization }}'. Refusing to guess - make the name unique per domain.
  when:
    - cred_type_exists | bool
    - existing_cred.json.results | length > 1

- name: Set credential ID
  ansible.builtin.set_fact:
    cred_id: "{{ existing_cred.json.results[0].id }}"
  when:
    - cred_type_exists | bool
    - existing_cred.json.results | length == 1

- name: Build credential inputs for {{ item }}
  ansible.builtin.set_fact:
    cred_inputs: >-
      {{ {
        'VMware vCenter': {
          'username': user1,
          'password': acc_new_pw,
          'host': var_AAP_VCenter_Host
        },
        'Machine': {
          'username': user1,
          'password': acc_new_pw,
          'become_method': 'runas',
          'become_username': user1,
          'become_password': acc_new_pw
        },
        'cvs-WinRM_Cred': {
          'username': user1,
          'password': acc_new_pw
        },
        'cvs-CenterAdmin_Cred': {
          'username': user1,
          'password': acc_new_pw
        }
      }.get(item, {}) }}
  no_log: false
  when: cred_id | length > 0

- name: Warn on unmapped credential type
  ansible.builtin.debug:
    msg: "WARN: no input mapping defined for credential type '{{ item }}' - skipping update"
  when:
    - cred_id | length > 0
    - cred_inputs | length == 0

- name: Update password for {{ var_AAP_Credentials }} ({{ item }})
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credentials/{{ cred_id }}/"
    method: PATCH
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    body_format: json
    body:
      inputs: "{{ cred_inputs }}"
    status_code: 200
  register: update_result
  no_log: false
  delegate_to: localhost
  when:
    - cred_id | length > 0
    - cred_inputs | length > 0

- name: Display success message
  ansible.builtin.debug:
    msg: "OK: updated password for credential '{{ var_AAP_Credentials }}' ({{ item }})"
  when: update_result.status | default(0) == 200

- name: Display credential not found warning
  ansible.builtin.debug:
    msg: >-
      WARN: credential '{{ var_AAP_Credentials }}' of type '{{ item }}' not found
      in organization '{{ var_AAP_organization }}' - skipping update
  when:
    - cred_type_exists | bool
    - existing_cred.json.results | length == 0
