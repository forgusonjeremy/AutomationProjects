---   
- name: debug
  debug:
    msg: "{{ acc_new_pw }}"
  when: var_debug == 69 

- name: Get organization ID
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/organizations/?name={{ var_AAP_organization }}"
    method: GET
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    status_code: 200
  register: org_lookup
  delegate_to: localhost
  run_once: true

- name: Set organization ID
  ansible.builtin.set_fact:
    org_id: "{{ org_lookup.json.results[0].id }}"
  run_once: true

- name: Get credential type ID for {{ item }}
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credential_types/?name={{ item }}"
    method: GET
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    status_code: 200
  register: cred_type_lookup
  delegate_to: localhost

- name: Check if credential type exists
  ansible.builtin.set_fact:
    cred_type_exists: "{{ cred_type_lookup.json.results | length > 0 }}"

- name: Set credential type ID
  ansible.builtin.set_fact:
    cred_type_id: "{{ cred_type_lookup.json.results[0].id }}"
  when: cred_type_exists | bool

- name: Display credential type not found warning
  ansible.builtin.debug:
    msg: "⚠ Credential type '{{ item }}' not found in AAP - skipping"
  when: not (cred_type_exists | bool)

- name: Get existing credential {{ var_AAP_Credentials }}
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credentials/?name={{ var_AAP_Credentials }}&organization={{ org_id }}&credential_type={{ cred_type_id }}"
    method: GET
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    status_code: 200
  register: existing_cred
  delegate_to: localhost
  when: cred_type_exists | bool

- name: Debug - Show credential search results
  ansible.builtin.debug:
    msg:
      - "Searching for credential: '{{ var_AAP_Credentials }}'"
      - "Credential type: '{{ item }}' (ID: {{ cred_type_id }})"
      - "Organization: '{{ var_AAP_organization }}' (ID: {{ org_id }})"
      - "Found {{ existing_cred.json.results | length }} matching credential(s)"
      - "Results: {{ existing_cred.json.results | map(attribute='name') | list if existing_cred.json.results | length > 0 else 'No credentials found' }}"
  when: cred_type_exists | bool

- name: Set credential ID
  ansible.builtin.set_fact:
    cred_id: "{{ existing_cred.json.results[0].id }}"
  when: 
    - cred_type_exists | bool
    - existing_cred.json.results | length > 0

- name: Update password for {{ var_AAP_Credentials }} ({{ item }}) - VMware vCenter type
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credentials/{{ cred_id }}/"
    method: PATCH
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    body_format: json
    body:
      description: "Machine credential that leverages kerberos"
      inputs:
        username: "{{ var_LDAPUsername }}"
        password: "{{ acc_new_pw }}"
        host: "{{ var_AAP_VCenter_Host }}"
    status_code: 200
  register: update_result
  when: 
    - cred_type_exists | bool
    - item == 'VMware vCenter'
    - existing_cred.json.results | length > 0
  no_log: true
  delegate_to: localhost

- name: Update password for {{ var_AAP_Credentials }} ({{ item }}) - Machine type
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credentials/{{ cred_id }}/"
    method: PATCH
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    body_format: json
    body:
      description: "credential created by playbook"
      inputs:
        username: "{{ var_LDAPUsername }}"
        password: "{{ acc_new_pw }}"
        become_method: "runas"
        become_username: "{{ var_LDAPUsername }}"
        become_password: "{{ acc_new_pw }}"
    status_code: 200
  register: update_result
  when: 
    - cred_type_exists | bool
    - item == 'Machine'
    - existing_cred.json.results | length > 0
  no_log: true
  delegate_to: localhost

- name: Update password for svcCVSAnsWin (cvs-WinRM_Cred) - cvs-WinRM_Cred type
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credentials/{{ cred_id }}/"
    method: PATCH
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    body_format: json
    body:
      description: "credential created by playbook"
      inputs:
        username: "{{ var_LDAPUsername }}"
        password: "{{ acc_new_pw }}"
    status_code: 200
  register: update_result
  when: 
    - cred_type_exists | bool
    - item == 'cvs-WinRM_Cred'
    - existing_cred.json.results | length > 0
  no_log: true
  delegate_to: localhost

- name: Update password for {{ var_AAP_Credentials }} ({{ item }}) - AnsvCenterAdmin type
  ansible.builtin.uri:
    url: "{{ controller_host }}/api/controller/v2/credentials/{{ cred_id }}/"
    method: PATCH
    user: "{{ controller_username if not controller_token else omit }}"
    password: "{{ controller_password if not controller_token else omit }}"
    force_basic_auth: "{{ true if not controller_token else omit }}"
    headers: "{{ {'Authorization': 'Bearer ' + controller_token} if controller_token else omit }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    body_format: json
    body:
      description: "credential created by playbook"
      inputs:
        username: "{{ var_LDAPUsername }}"
        password: "{{ acc_new_pw }}"
    status_code: 200
  register: update_result
  when: 
    - cred_type_exists | bool
    - item == 'cvs-CenterAdmin_Cred'
    - existing_cred.json.results | length > 0
  no_log: true
  delegate_to: localhost

- name: Display success message
  ansible.builtin.debug:
    msg: "✓ Successfully updated password for credential '{{ var_AAP_Credentials }}' ({{ item }})"
  when: 
    - cred_type_exists | bool
    - update_result is defined
    - update_result.status is defined
    - update_result.status == 200

- name: Display credential not found warning
  ansible.builtin.debug:
    msg: "⚠ Credential '{{ var_AAP_Credentials }}' of type '{{ item }}' not found in organization '{{ var_AAP_organization }}' - skipping update"
  when: 
    - cred_type_exists | bool
    - existing_cred.json.results | length == 0