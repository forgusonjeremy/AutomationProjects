---
- name: Creates directory
  ansible.builtin.file:
    path: "{{ var_destfolder }}"
    state: directory

# Authenticate to Gitlab
- name: Authentication block
  block:
  - name: obtain Access Token
    uri:
      url: "{{ gitlab_endpoint }}/oauth/token"
      method: POST
      status_code: 200
      validate_certs: false
      body_format: json
      headers:
        Content-Type: application/json
      body: >
        {
          "grant_type": "password",
          "username": "{{ var_username }}",
          "password": "{{ var_password }}"
        }
    register: gitlab_AccessToken

  - name: Set facts
    ansible.builtin.set_fact:
      Auth_token: "{{ gitlab_AccessToken.json.access_token }}"

# kick off the export process 
- include_tasks: gitLab_export_task.yml
  loop: "{{ Project_IDs }}"

# # pause and give export process to finish
# - name: Pause for 10 seconds to build app cache
#   ansible.builtin.pause:
#     seconds: 4

# Download export file and move to local share location        
- include_tasks: gitLab_download_task.yml
  loop: "{{ Project_IDs }}"

# move file form local share to Network Share location
- name: get file names to copy
  command: "find {{ var_destfolder }} -type f"
  register: files_to_copy

- name: mount share
  ansible.builtin.expect:
    command: "mount -t cifs -o vers=3.0,username={{ WinRM_username }} //{{ var_WinRM_host }}/TempDir {{ var_shareMount }}"
    responses:
      (?i)Password: "{{ WinRM_password }}"
  no_log: false
  ignore_errors: True

- name: Copy file to the Share location
  copy:
    src: "{{ item }}" 
    dest: "{{ var_shareLocation }}"
    remote_src: True
    mode: 0644
  become: true
  with_items:
  - "{{ files_to_copy.stdout_lines }}"

- name: umount share
  command: "umount {{ var_shareMount }}"

- name: remove files
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  with_items:
    - "{{ files_to_copy.stdout_lines }}"
