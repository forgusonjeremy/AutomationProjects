- name: Start the export proccess
  uri:
    url: "{{ gitlab_endpoint }}/api/v4/projects/{{ item }}/export"
    method: POST
    status_code: 
      - 200
      - 201
      - 202
      - 409
    validate_certs: false
    body_format: json
    headers:
      Content-Type: application/json
      Authorization: Bearer {{ Auth_token }}

# pause and give export process to finish
- name: Pause for seconds to build app cache
  ansible.builtin.pause:
    seconds: "{{ var_export_pause_time }}"
