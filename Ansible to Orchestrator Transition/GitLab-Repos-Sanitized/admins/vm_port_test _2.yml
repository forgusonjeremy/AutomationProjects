    #     - 'dom22.dom3.example'
    #     - 'dom28.dom3.example'
    #     - 'dom33.dom3.example'
    #     - 'dom29.dom3.example'
    #     - 'dom37.dom3.example'
    #     - dom35.dom3.example
    #     - dom36.dom3.example
    # var_test_port:
    #     - 22
    #     - 443
    #     - 80

  tasks:
  - name: sleep
    ansible.builtin.shell: sleep 60000

  - name: Gather info about the cluster 
    include_tasks: tasks/ports_check.yml
    with_items: "{{ var_list_vm }}"
    loop_control:
      loop_var: port_task_item