---
- name: Change Nexus Switch Admin Password
  hosts: all
  gather_facts: False
  
  tasks:
    - name: Set password variable from inventory hostname and survey inputs
      ansible.builtin.set_fact:
        new_admin_password: "{{ password_prefix }}{{ inventory_hostname | lower }}{{ password_suffix }}"
      no_log: true

    - name: Change admin user password
      cisco.nxos.nxos_user:
        name: admin
        configured_password: "{{ new_admin_password }}"
        update_password: always
        state: present
      no_log: true

    - name: Save configuration
      cisco.nxos.nxos_config:
        save_when: always

    - name: Verify admin user exists
      cisco.nxos.nxos_command:
        commands:
          - show user-account admin
      register: user_check
      
    - name: Display success message
      debug:
        msg: "Admin password successfully changed on {{ inventory_hostname }}"