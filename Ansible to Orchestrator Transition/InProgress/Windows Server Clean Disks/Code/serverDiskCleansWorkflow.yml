inputForms:
  - layout:
      pages:
        - id: page_k0g2rn4t
          sections:
            - id: section_mnx0dvdx
              fields:
                - id: distinguishedName
                  display: textField
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_l4sjfgof
              fields:
                - id: folderTarget
                  display: array
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_kx7svay5
              fields:
                - id: fileFilter
                  display: textField
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_vanbj0ac
              fields:
                - id: reportOnly
                  display: dropDown
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_31a225d5
              fields:
                - id: emailReport
                  display: checkbox
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_o9d6u2f8
              fields:
                - id: folderIncluded
                  display: checkbox
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_bfbc8abe
              fields:
                - id: forceEnable
                  display: checkbox
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_oc6y8khl
              fields:
                - id: olderThanDays
                  display: decimalField
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_9dwp0j2k
              fields:
                - id: mailTo
                  display: array
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_8zhcl228
              fields:
                - id: mailSubject
                  display: textField
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
            - id: section_8kfqxzxa
              fields:
                - id: targetPath
                  display: textField
                  signpostPosition: right-middle
                  state:
                    visible: true
                    read-only: false
          title: General
          state: {}
    schema:
      distinguishedName:
        id: distinguishedName
        type:
          dataType: string
        label: AD Group Distinguished Name
        constraints:
          required: false
      folderTarget:
        id: folderTarget
        type:
          dataType: string
          isMultiple: true
        label: Folder where files to be deleted are located
        constraints:
          required: false
      fileFilter:
        id: fileFilter
        type:
          dataType: string
        label: >-
          Delete files with the following string in the name (wildcard search
          supported)
        constraints:
          required: false
      reportOnly:
        id: reportOnly
        type:
          dataType: string
        label: Report Only or Report and Delete?
        valueList:
          - value: 'yes'
            label: Report Only
          - value: 'no'
            label: Report and Delete
        constraints: {}
      emailReport:
        id: emailReport
        type:
          dataType: boolean
        label: Email Report?
        constraints:
          required: false
      folderIncluded:
        id: folderIncluded
        type:
          dataType: boolean
        label: Delete folder containing the matched files as well?
        constraints:
          required: false
      forceEnable:
        id: forceEnable
        type:
          dataType: boolean
        label: Delete Read-Only items?
        constraints:
          required: false
      olderThanDays:
        id: olderThanDays
        type:
          dataType: decimal
        label: Delete Files/Folders Older Than x Days
        constraints:
          required: false
      mailTo:
        id: mailTo
        type:
          dataType: string
          isMultiple: true
        label: Email addresses to whom report is to be sent
        constraints:
          required: false
      mailSubject:
        id: mailSubject
        type:
          dataType: string
        label: Email Subject
        constraints:
          required: false
      targetPath:
        id: targetPath
        type:
          dataType: string
        label: Script execution directory (UNC path)
        constraints:
          required: false
    options:
      externalValidations: []
    itemId: ''
workflowSchema:
  display-name: Windows Server Disk Cleans
  position:
    'y': 10
    x: 50
  input:
    param:
      - description: ''
        name: distinguishedName
        type: string
      - name: folderTarget
        type: Array/string
      - name: fileFilter
        type: string
      - name: reportOnly
        type: string
      - name: folderIncluded
        type: boolean
      - name: olderThanDays
        type: number
      - name: mailTo
        type: Array/string
      - name: mailSubject
        type: string
      - name: forceEnable
        type: boolean
      - description: >-
          Full path to the script file on the PowerShell host (directory and
          file name)
        name: targetPath
        type: string
      - name: emailReport
        type: boolean
  output:
    param:
      - name: executionSuccess
        type: boolean
      - name: executionOuput
        type: string
      - name: ServersProcessed
        type: number
      - name: itemsDeleted
        type: number
      - name: bytesFreed
        type: number
      - name: transcript
        type: string
  attrib:
    - type: AD:AdHost
      name: adHost
    - type: AD:UserGroup
      name: adGroup
    - type: Array/string
      name: computerNames
    - description: ''
      value:
        array:
          elements:
            - sdk-object:
                type: PowerShell:PowerShellHost
                href: >-
                  https://cvsd26vcfauto01.connect.lab:443/vco/api/catalog/PowerShell/PowerShellHost/0c675c7a-137b-40c3-af36-6f36223dfa59/
                id: 0c675c7a-137b-40c3-af36-6f36223dfa59
      type: Array/PowerShell:PowerShellHost
      name: psHosts
    - type: PowerShell:PowerShellHost
      name: resolvedHost
    - value:
        number:
          value: 25
      type: number
      name: maxItemsListed
    - value:
        properties:
          property: []
      type: Properties
      name: scriptParameters
    - value:
        sdk-object:
          type: ResourceElement
          href: >-
            https://cvsd26vcfauto01.connect.lab:443/vco/api/catalog/System/ResourceElement/5fc71d56-a5c4-4dd3-8489-72f91b38e845/
          id: 5fc71d56-a5c4-4dd3-8489-72f91b38e845
      type: ResourceElement
      name: scriptElement
    - value:
        string:
          value: ''
      type: string
      name: stagedScript
    - value:
        properties:
          property: []
      type: Properties
      name: scriptRunResult
    - value:
        string:
          value: ''
      type: string
      name: reportSubject
    - value:
        string:
          value: ''
      type: string
      name: reportHtml
    - value:
        string:
          value: mail.vcf.lab
      type: string
      name: smtpHost
    - value:
        number:
          value: 587
      type: number
      name: smtpPort
    - description: Username for authentication
      value:
        string:
          value: ''
      type: string
      name: username
    - description: Password for authentication
      value:
        secure-string:
          value: ''
          isPlainText: false
      type: SecureString
      name: password
    - description: Sender's name
      value:
        string:
          value: no-reply-infmonitoring@vcf.lab
      type: string
      name: fromName
    - description: Sender's address
      value:
        string:
          value: no-reply-infmonitoring@vcf.lab
      type: string
      name: fromAddress
    - description: >-
        If true, enables the use of the STARTTLS command (if supported by the
        server) to switch the connection to a TLS-protected connection before
        issuing any login commands.
      value:
        boolean:
          value: true
      type: boolean
      name: useStartTls
    - type: number
      name: mailLoopCounter
    - value:
        string:
          value: ''
      type: string
      name: emailAddress
  workflow-item:
    - display-name: findAdHostForDn
      script:
        value: >
          //Auto generated script, cannot be modified !

          actionResult =
          System.getModule("com.broadcom.pso.vcf.activedirectory").findAdHostForDn(distinguishedName);
        encoded: false
      in-binding:
        bind:
          - description: ''
            name: distinguishedName
            type: string
            export-name: distinguishedName
      out-binding:
        bind:
          - name: actionResult
            type: AD:AdHost
            export-name: adHost
      description: Add a note to the workflow schema.
      position:
        'y': 20
        x: 140
      name: item1
      out-name: item2
      type: task
      script-module: com.broadcom.pso.vcf.activedirectory/findAdHostForDn
      comparator: 0
    - display-name: resolveAdGroup
      script:
        value: >
          //Auto generated script, cannot be modified !

          actionResult =
          System.getModule("com.broadcom.pso.vcf.activedirectory").resolveAdGroup(adGroupDn,adHost);
        encoded: false
      in-binding:
        bind:
          - description: ''
            name: adGroupDn
            type: string
            export-name: distinguishedName
          - description: ''
            name: adHost
            type: AD:AdHost
            export-name: adHost
      out-binding:
        bind:
          - name: actionResult
            type: AD:UserGroup
            export-name: adGroup
      description: Add a note to the workflow schema.
      position:
        'y': 20
        x: 270
      name: item2
      out-name: item3
      type: task
      script-module: com.broadcom.pso.vcf.activedirectory/resolveAdGroup
      comparator: 0
    - display-name: Get Computers in AD Group - Direct Members
      script:
        value: >
          //Auto generated script, cannot be modified !

          actionResult =
          System.getModule("com.broadcom.pso.vcf.activedirectory").getADComputersGroupDirectMembers(adGroup);
        encoded: false
      in-binding:
        bind:
          - description: ''
            name: adGroup
            type: AD:UserGroup
            export-name: adGroup
      out-binding:
        bind:
          - name: actionResult
            type: Array/string
            export-name: computerNames
      description: Add a note to the workflow schema.
      position:
        'y': 20
        x: 400
      name: item3
      out-name: item4
      type: task
      script-module: com.broadcom.pso.vcf.activedirectory/getADComputersGroupDirectMembers
      comparator: 0
    - display-name: selectPowerShellHost
      script:
        value: >
          //Auto generated script, cannot be modified !

          actionResult =
          System.getModule("com.broadcom.pso.powershell").selectPowerShellHost(psHosts);
        encoded: false
      in-binding:
        bind:
          - description: ''
            name: psHosts
            type: Array/PowerShell:PowerShellHost
            export-name: psHosts
      out-binding:
        bind:
          - name: actionResult
            type: PowerShell:PowerShellHost
            export-name: resolvedHost
      description: Add a note to the workflow schema.
      position:
        'y': 20
        x: 540
      name: item4
      out-name: item5
      type: task
      script-module: com.broadcom.pso.powershell/selectPowerShellHost
      comparator: 0
    - display-name: Create Script Parameters
      script:
        value: >-
          /* IN   computerNames   Array/string    attr    from element 3
           *      adGroup         AD:UserGroup    attr    from element 2
           *      folderTarget    Array/string    input
           *      olderThanDays   number          input
           *      folderIncluded  boolean         input
           *      forceEnable     boolean         input
           *      reportOnly      string          input
           *      fileFilter      string          attr    ('*.*')
           *      maxItemsListed  number          attr    (25)
           *      emailReport     boolean         input
           *      mailTo          Array/string    input
           * OUT  scriptParameters  Properties    attr    → element 7 'parameters'
           *
           * Does no work of its own. Checks the request, turns it into the Properties bag
           * Invoke-ServerDiskClean.ps1 expects, and says in the log what it decided. Nothing has
           * touched the PowerShell host or any server yet, so every refusal here is free.
           * ═════════════════════════════════════════════════════════════════════════════ */

          function trim(value) {
              return (value === null || value === undefined) ? "" : String(value).replace(/^\s+|\s+$/g, "");
          }


          // -- 1. Refuse to run against nothing
          -----------------------------------------

          if (computerNames === null || computerNames === undefined ||
          computerNames.length === 0) {
              throw new Error(
                  "Create Script Parameters: no servers were resolved. The AD group has no enabled computer " +
                  "accounts as DIRECT members -- nested groups are deliberately not expanded for a destructive " +
                  "action. Check the 'Get Computers in AD Group' log: if it named nested groups, that is where " +
                  "the servers are."
              );
          }

          var groupName = String(adGroup.name);

          System.log("Servers (" + computerNames.length + ") in '" + groupName +
          "': " + computerNames.join(", "));


          // -- 2. The safety gate
          -------------------------------------------------------

          // Only the exact value 'no' deletes. The script's -ReportOnly has
          ValidateSet('yes','no'),

          // so it would refuse anything else too -- but refusing here gives the
          operator a message

          // naming the input instead of a PowerShell parameter-binding error.

          var gate = trim(reportOnly).toLowerCase();

          if (gate !== "yes" && gate !== "no") {
              throw new Error(
                  "Create Script Parameters: reportOnly must be 'yes' (report only - delete nothing) or 'no' " +
                  "(delete for real). Received: '" + reportOnly + "'."
              );
          }


          // -- 3. Age
          --------------------------------------------------------------------

          var days = Number(olderThanDays);

          if (olderThanDays === null || olderThanDays === undefined ||
          isNaN(days) || days < 0 || Math.floor(days) !== days) {
              throw new Error(
                  "Create Script Parameters: olderThanDays must be a whole number, 0 or greater " +
                  "(1 = older than a day, 0 = everything up to now). Received: " + olderThanDays
              );
          }


          // -- 4. Folder targets
          ----------------------------------------------------------

          // The same refusals the script makes (Test-FolderTarget, S-36), made
          here first so a bad

          // path never reaches the host: a drive root, or anything that IS or
          is INSIDE a protected

          // operating-system tree -- except the known-safe cache folders below
          (and anything inside

          // them). c:\users is deliberately allowed -- two production templates
          clean it.

          //

          // KEEP THESE TWO LISTS IDENTICAL TO THE SCRIPT'S. To allow another
          folder inside a

          // protected tree, add it here AND to $AllowedInsideProtected in
          Invoke-ServerDiskClean.ps1.

          var protectedTrees = ["\\windows", "\\program files", "\\program files
          (x86)", "\\programdata",
                                "\\boot", "\\recovery", "\\system volume information"];
          var allowedInsideProtected = ["\\windows\\ccmcache",
          "\\windows\\temp", "\\windows\\softwaredistribution\\download"];


          function isOrInside(candidate, tree) {
              return candidate === tree || candidate.indexOf(tree + "\\") === 0;
          }

          var folders = [];

          if (folderTarget !== null && folderTarget !== undefined) {
              for (var f = 0; f < folderTarget.length; f++) {
                  var path = trim(folderTarget[f]).replace(/\//g, "\\");
                  if (path === "") { continue; }
                  if (!/^[a-zA-Z]:\\/.test(path)) {
                      throw new Error("Create Script Parameters: folderTarget '" + path + "' must be an absolute local path with a drive letter, as seen on the server (e.g. c:\\Windows\\ccmcache).");
                  }
                  if (/[*?"<>|]/.test(path) || /(^|\\)\.\.(\\|$)/.test(path)) {
                      throw new Error("Create Script Parameters: folderTarget '" + path + "' contains a wildcard, '..', or a character not valid in a path.");
                  }
                  var rest = path.substring(2).replace(/\\+$/, "").toLowerCase();
                  if (rest === "") {
                      throw new Error("Create Script Parameters: folderTarget '" + path + "' is the root of a drive. That is never a disk-clean target.");
                  }
                  var allowed = false;
                  for (var a = 0; a < allowedInsideProtected.length; a++) {
                      if (isOrInside(rest, allowedInsideProtected[a])) { allowed = true; break; }
                  }
                  if (!allowed) {
                      for (var r = 0; r < protectedTrees.length; r++) {
                          if (isOrInside(rest, protectedTrees[r])) {
                              var drive = path.substring(0, 2);
                              throw new Error(
                                  "Create Script Parameters: folderTarget '" + path + "' is inside the protected operating-system folder " +
                                  drive + protectedTrees[r] + " and is refused. The only folders allowed there are " +
                                  allowedInsideProtected.map(function (x) { return drive + x; }).join(", ") + " (and anything inside them)."
                              );
                          }
                      }
                  }
                  folders.push(path);
              }
          }

          if (folders.length === 0) {
              throw new Error("Create Script Parameters: folderTarget is empty. Give at least one folder, e.g. c:\\Windows\\ccmcache.");
          }


          // -- 5. Tick-boxes to the 'yes'/'no' the script expects
          -------------------------

          // Read, not tested for truth: if one of these inputs were ever
          declared as a string,

          // "no" is truthy in JavaScript and  value ? "yes" : "no"  would
          silently turn it on.

          // For forceEnable that would delete read-only files the operator
          chose to protect.

          function yesNo(value) {
              if (value === true)  { return "yes"; }
              if (value === false) { return "no"; }
              var text = trim(value).toLowerCase();
              return (text === "yes" || text === "true" || text === "1") ? "yes" : "no";
          }

          var folderFlag = yesNo(folderIncluded);

          var forceFlag  = yesNo(forceEnable);


          // -- 6. Email must be deliverable BEFORE anything is deleted
          --------------------

          // The OOTB 'Send notification (TLSv1.2)' workflow takes ONE toAddress
          string, so the

          // recipients are flattened here into a comma-separated list. An entry
          may itself hold

          // several addresses separated by , or ; -- each is trimmed and blanks
          are dropped.

          var recipients = [];

          if (mailTo !== null && mailTo !== undefined) {
              for (var m = 0; m < mailTo.length; m++) {
                  var pieces = String(mailTo[m] === null || mailTo[m] === undefined ? "" : mailTo[m]).split(/[,;]/);
                  for (var q = 0; q < pieces.length; q++) {
                      var address = trim(pieces[q]);
                      if (address === "") { continue; }
                      // Catches the classic binding mistake: a scalar string bound where an array was
                      // expected arrives split into single characters, none of which contain '@'.
                      if (address.indexOf("@") < 1) {
                          throw new Error("Create Script Parameters: '" + address + "' in mailTo is not an email address. Enter one address per row.");
                      }
                      recipients.push(address);
                  }
              }
          }

          mailToString = recipients.join(",");


          if (yesNo(emailReport) === "yes" && recipients.length === 0) {
              throw new Error("Create Script Parameters: emailReport is ticked but mailTo has no recipient. Add one, or untick emailReport.");
          }


          // -- 7. Say plainly what this run will do
          ----------------------------------------

          if (gate === "no") {
              System.warn(
                  "reportOnly='no' -- this run WILL DELETE items older than " + days + " day(s) from " + folders.join(", ") +
                  " on " + computerNames.length + " server(s) in '" + groupName + "'" +
                  (forceFlag === "yes" ? ", INCLUDING read-only items (forceEnable)" : "") +
                  (folderFlag === "yes" ? ", and whole folders older than the cutoff" : "") + "."
              );
          }

          else {
              System.log("reportOnly='yes' -- report-only run; nothing will be deleted.");
          }


          // -- 7b. The folder rule (S-35 / P-71)
          -------------------------------------------

          // fileFilter applies to FILES only; folders are chosen by age,
          whatever their name. But a

          // folder is deleted WHOLE, with everything in it -- so folders are
          deleted only when the

          // request says so in full: a filter matching every file AND
          permission to delete read-only

          // items. With anything less, folder deletion is DECLINED but the run
          continues and matching

          // files are still cleaned. The decision is made by the SCRIPT (so its
          log and the report

          // record it); this task only says so up front. It never widens a
          request.

          var filter = trim(fileFilter);

          if (filter === "") {
              throw new Error("Create Script Parameters: fileFilter is empty. Use '*.*' for every file, or a pattern such as '*.tmp'.");
          }

          if (folderFlag === "yes") {
              var problems = [];
              if (filter !== "*" && filter !== "*.*") {
                  problems.push("fileFilter is '" + filter + "', which does not match every file (use '*' or '*.*')");
              }
              if (forceFlag !== "yes") {
                  problems.push("'delete read-only items' (forceEnable) is not ticked");
              }
              if (problems.length > 0) {
                  System.warn(
                      "'Delete folder' is ticked, but " + problems.join(" and ") + ". Deleting a folder deletes everything in it, " +
                      "so FOLDERS WILL NOT BE DELETED on this run. Files matching '" + filter + "' are still processed. " +
                      "To delete folders as well, set fileFilter to '*.*' AND tick 'delete read-only items'."
                  );
              }
          }


          var listed = Number(maxItemsListed);

          if (isNaN(listed) || listed < 0) { listed = 25; }


          // -- 8. Build the bag
          -----------------------------------------------------------

          // Keys are the script's parameter names; invokeStagedScript turns
          each into -Key 'value'.

          scriptParameters = new Properties();

          scriptParameters.put("ComputerNames",  computerNames.join(","));

          scriptParameters.put("FolderTarget",   folders.join("|"));      // '|'
          can never appear in a path

          scriptParameters.put("OlderThanDays",  String(days));

          scriptParameters.put("FilterOn",       filter);

          scriptParameters.put("FolderIncluded", folderFlag);

          scriptParameters.put("ForceEnable",    forceFlag);

          scriptParameters.put("ReportOnly",     gate);                   //
          reportOnly 'yes' == ReportOnly 'yes'

          scriptParameters.put("MaxItemsListed", String(Math.floor(listed)));


          System.log(
              "servers=" + computerNames.length + ", folders=" + folders.join(" | ") + ", olderThanDays=" + days +
              ", folderIncluded=" + folderFlag + ", forceEnable=" + forceFlag + ", reportOnly=" + gate
          );
        encoded: false
      in-binding:
        bind:
          - name: computerNames
            type: Array/string
            export-name: computerNames
          - name: adGroup
            type: AD:UserGroup
            export-name: adGroup
          - name: folderTarget
            type: Array/string
            export-name: folderTarget
          - name: olderThanDays
            type: number
            export-name: olderThanDays
          - name: folderIncluded
            type: boolean
            export-name: folderIncluded
          - name: fileFilter
            type: string
            export-name: fileFilter
          - name: maxItemsListed
            type: number
            export-name: maxItemsListed
          - name: emailReport
            type: boolean
            export-name: emailReport
          - name: mailTo
            type: Array/string
            export-name: mailTo
          - name: reportOnly
            type: string
            export-name: reportOnly
          - name: forceEnable
            type: boolean
            export-name: forceEnable
      out-binding:
        bind:
          - name: scriptParameters
            type: Properties
            export-name: scriptParameters
      description: Simple task with custom script capability.
      position:
        'y': 90
        x: 140
      name: item5
      out-name: item6
      type: task
      comparator: 0
    - display-name: stageScriptOnHost
      script:
        value: >
          //Auto generated script, cannot be modified !

          actionResult =
          System.getModule("com.broadcom.pso.powershell").stageScriptOnHost(psHost,script,targetPath);
        encoded: false
      in-binding:
        bind:
          - description: ''
            name: psHost
            type: PowerShell:PowerShellHost
            export-name: resolvedHost
          - description: ''
            name: script
            type: ResourceElement
            export-name: scriptElement
          - description: ''
            name: targetPath
            type: string
            export-name: targetPath
      out-binding:
        bind:
          - name: actionResult
            type: string
            export-name: stagedScript
      description: Add a note to the workflow schema.
      position:
        'y': 90
        x: 260
      name: item6
      out-name: item7
      type: task
      script-module: com.broadcom.pso.powershell/stageScriptOnHost
      comparator: 0
    - display-name: invokeStagedScript
      script:
        value: >
          //Auto generated script, cannot be modified !

          actionResult =
          System.getModule("com.broadcom.pso.powershell").invokeStagedScript(psHost,scriptPath,parameters);
        encoded: false
      in-binding:
        bind:
          - description: ''
            name: psHost
            type: PowerShell:PowerShellHost
            export-name: resolvedHost
          - description: ''
            name: scriptPath
            type: string
            export-name: stagedScript
          - description: ''
            name: parameters
            type: Properties
            export-name: scriptParameters
      out-binding:
        bind:
          - name: actionResult
            type: Properties
            export-name: scriptRunResult
      description: Add a note to the workflow schema.
      position:
        'y': 90
        x: 400
      name: item7
      out-name: item8
      type: task
      script-module: com.broadcom.pso.powershell/invokeStagedScript
      comparator: 0
    - display-name: Parse Results
      script:
        value: >-
          /* IN   scriptRunResult   Properties                 attr    from
          element 7
           *      adGroup           AD:UserGroup               attr    from element 2
           *      resolvedHost      PowerShell:PowerShellHost  attr    from element 4
           *      stagedScript        string                     attr    from element 6
           *      folderIncluded    boolean                    input
           *      forceEnable       boolean                    input
           *      mailSubject       string                     input
           * OUT  executionSuccess  boolean     output
           *      executionOutput   string      output
           *      serversProcessed  number      output
