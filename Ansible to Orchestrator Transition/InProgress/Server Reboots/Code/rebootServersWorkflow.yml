          dataType: string
          isMultiple: true
        label: mailTo
        constraints:
          required: false
      mailCc:
        id: mailCc
        type:
          dataType: string
          isMultiple: true
        label: mailCc
        constraints:
          required: false
      mailSubject:
        id: mailSubject
        type:
          dataType: string
        label: mailSubject
        constraints:
          required: false
      smtpServer:
        id: smtpServer
        type:
          dataType: string
        label: smtpServer
        constraints:
          required: false
    layout:
